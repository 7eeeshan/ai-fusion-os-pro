[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fusion-os-pro"
version = "0.8.0"
description = "AI Fusion OS Pro: governed autonomous AI workforce. Phase 1: security controller, policy engine, sandbox, approvals, audit log."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
fusion-os = "fusion_os.cli:main"

[tool.setuptools.packages.find]
include = ["fusion_os*"]

[tool.setuptools.package-data]
fusion_os = ["security/default_policy.json", "api/dashboard.html", "research/onion_fetch.py", "sandbox/guard.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "vercel_app:app"
