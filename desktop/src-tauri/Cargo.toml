[package]
name = "ai-fusion-os-pro"
version = "0.8.0"
description = "AI Fusion OS Pro desktop app"
edition = "2021"
publish = false

[lib]
name = "ai_fusion_os_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
