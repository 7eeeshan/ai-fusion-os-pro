<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Fusion OS Pro</title>
<style>
:root{color-scheme:dark light;--bg:#111827;--fg:#e6edf3;--mute:#8b949e;--accent:#4c8dff}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--fg:#1f2328;--mute:#57606a}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 24px}
img{width:112px;height:112px}
h1{font-size:22px;margin:0;font-weight:600}
#status{color:var(--mute);max-width:560px;min-height:1.4em}
.bar{width:220px;height:3px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--accent);animation:s 1.4s ease-in-out infinite}
@keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion: reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="">
  <h1>AI Fusion OS Pro</h1>
  <div class="bar"><i></i></div>
  <p id="status">Starting…</p>
</main>
<script>window.setStatus = (t) => { document.getElementById("status").textContent = t; };</script>
</body>
</html>
