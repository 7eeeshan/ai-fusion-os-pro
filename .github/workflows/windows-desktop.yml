name: Windows desktop app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --require-hashes -r packaging/windows/requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install "pytest==8.4.2"
      - name: Test
        run: python -m pytest -q

  build:
    name: Build installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Bundle Python backend
        shell: pwsh
        run: ./packaging/windows/build-backend.ps1
      - name: Bundle Tor
        shell: bash
        run: ./packaging/windows/build-tor.sh
      - name: Build desktop app and installers
        working-directory: desktop
        run: |
          npm ci
          npx tauri build
      - name: Collect release files
        shell: pwsh
        run: ./packaging/windows/collect.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Fusion-OS-Pro-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
