name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker pull -q alpine:3.20 && docker pull -q python:3.12-slim
      - run: AFE_URL=http://127.0.0.1:1 python -m pytest -q
